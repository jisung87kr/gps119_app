<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오프라인 - GPS119</title>
    <link rel="icon" type="image/png" href="/icon-192.png">
    <!--
        서비스워커 오프라인 폴백. 네트워크가 없는 상태에서 뜨는 화면이라
        빌드된 CSS·웹폰트에 의존하지 않고 "Ink + Brand" 팔레트 hex 를 인라인으로 옮겼다.
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 40px 24px;
            background: #FAFAF9;                 /* ink-50 */
            color: #0E0C0A;                      /* ink-950 */
            font-family: 'Pretendard', ui-sans-serif, system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .box { width: 100%; max-width: 384px; text-align: center; }
        .mark {
            width: 64px; height: 64px; margin: 0 auto 24px;
            background: #0E6E7C;                 /* brand-600 */
            border-radius: 24px; color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
        p {
            margin: 8px 0 0; font-size: 15px; line-height: 1.7;
            color: #79746C;                      /* ink-500 */
            word-break: keep-all;
        }
        button {
            margin-top: 32px; width: 100%;
            background: #0E6E7C; color: #fff; border: 0;
            padding: 16px; border-radius: 16px;
            font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
        }
        button:active { background: #0A5560; }   /* brand-700 */
    </style>
</head>
<body>
    <div class="box">
        <div class="mark" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z" />
            </svg>
        </div>
        <h1>오프라인 상태입니다</h1>
        <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>긴급 시에는 119로 바로 전화하세요.</p>
        <button type="button" onclick="location.reload()">다시 시도</button>
    </div>
</body>
</html>
