# 로컬 개발용 HTTPS vhost (호스트 9051 → 컨테이너 443).
#
# 🔑 왜 로컬에 TLS 가 필요한가
#    `navigator.geolocation`·서비스워커·웹푸시는 **보안 컨텍스트에서만** 동작한다.
#    예외는 `localhost` 뿐이고 **사설 IP 는 예외가 아니다.** 그래서 PC 에서
#    `http://localhost:9050` 으로는 되던 위치 조회가, 폰이나 앱에서 LAN 주소로
#    붙는 순간 «권한을 묻지도 않고» 실패한다. 웹뷰 문제로 오진하기 쉬운 지점이다.
#
# 인증서는 mkcert 로 만든 로컬 CA 서명본이다(`docker/apache/certs/`, gitignore).
# 기기마다 루트 CA 를 신뢰시켜야 한다 — 절차는 README 참조.
#
# ⚠️ 개발 전용이다. 운영 TLS 는 여기서 오지 않는다.

<VirtualHost *:443>
    ServerAdmin webmaster@localhost

    SSLEngine on
    SSLCertificateFile    /etc/apache2/gps119/certs/server.crt
    SSLCertificateKeyFile /etc/apache2/gps119/certs/server.key

    Include /etc/apache2/gps119/common.conf

    ErrorLog  ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
