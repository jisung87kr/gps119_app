# 운영용 vhost (80 → 301 → 443). 개발용 apache.conf / apache-ssl.conf 와 «다른 파일»이다.
#
# 개발용과의 차이:
#   - 인증서가 mkcert 로컬 CA 가 아니라 호스트의 Let's Encrypt 발급본이다
#   - localhost 예외가 없다. 운영엔 http 로 머무를 이유가 있는 경로가 하나뿐이다(ACME)
#   - 포트를 바꿔 붙이는 리다이렉트(9050→9051)가 없다. 표준 포트라 그럴 필요가 없다
#
# `${APP_DOMAIN}` 은 컨테이너 환경변수를 Apache 가 설정 파싱 시점에 전개한 것이다
# (docker-compose.prod.yml 의 app.environment). 미설정이면 Apache 가 기동에 실패한다 —
# 잘못된 ServerName 으로 조용히 뜨는 것보다 낫다.
# 만약 이 전개가 환경에 따라 동작하지 않으면 아래 3곳의 ${APP_DOMAIN} 을 실도메인 문자열로
# 바꿔 넣으면 된다.

<VirtualHost *:80>
    ServerName ${APP_DOMAIN}

    # --- Let's Encrypt 갱신(webroot) 통로 ---
    # 🔑 이 예외가 없으면 갱신 요청이 301 을 맞고 실패한다. 그런데 실패는 «인증서 만료 당일»에야
    #    표면화되고, 그날 증상은 「앱에서 아무것도 안 되는데 서버 로그는 멀쩡함」이다.
    #    (위치·푸시·서비스워커가 전부 보안 컨텍스트를 요구하므로 한꺼번에 죽는다)
    Alias /.well-known/acme-challenge /var/www/html/public/.well-known/acme-challenge
    <Directory /var/www/html/public/.well-known/acme-challenge>
        # ⚠️ `Options None` 으로 두면 «갱신 통로가 403 으로 막힌다».
        #    FollowSymLinks 와 SymLinksIfOwnerMatch 가 둘 다 꺼지면 mod_rewrite 가 그
        #    디렉터리에서 동작을 거부한다(AH00670) — 아래 RewriteRule 이 이 경로를 예외
        #    처리하려고 평가되는 순간 403 이 된다. 즉 «방어하려고 넣은 옵션이 방어 대상을
        #    막는다». 리허설에서 실측으로 확인했다(2026-08-10).
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://${APP_DOMAIN}/$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName ${APP_DOMAIN}

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/${APP_DOMAIN}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${APP_DOMAIN}/privkey.pem

    # includeSubDomains·preload 는 일부러 뺐다 — 되돌리기가 매우 어렵고,
    # 서브도메인 계획이 아직 없다.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # DocumentRoot 와 Reverb 역프록시(/app, /apps)는 개발용과 «같은 파일»을 쓴다.
    # 프록시 대상이 늘면 common.conf 한 곳만 고치면 양쪽에 반영된다.
    Include /etc/apache2/gps119/common.conf

    ErrorLog  ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
