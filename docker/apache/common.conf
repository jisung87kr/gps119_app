# http(80) / https(443) 두 vhost 가 «공유»하는 부분.
#
# 🔑 두 vhost 에 복붙하지 않는 이유: 한쪽에만 라우팅 규칙을 추가하면 「PC 에서는 되는데
#    폰에서는 안 되는」 종류의 버그가 되고, 원인이 Apache 설정이라는 걸 아무도 의심하지
#    않는다. 프록시 대상이 늘면 여기 한 곳만 고친다.

DocumentRoot /var/www/html/public

<Directory /var/www/html/public>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- 번들을 «안 거치는» JS 모듈의 캐시 (2026-09-01) ---
#
# 🔴 `public/js/**` 는 Vite 번들이 아니라 브라우저에 «원본 그대로» 서빙된다.
#    그래서 파일명에 해시가 안 붙고, 고쳐도 브라우저·웹뷰가 옛 사본을 계속 쓴다.
#    실기기에서 3시간 전 사본이 돌아 새로 추가한 메서드가 없었고, 버튼을 눌러도
#    아무 일이 일어나지 않았다(2026-08-31). 증상이 「버튼이 안 눌린다」 하나뿐이라
#    UI 문제로 오진하기 딱 좋다.
#
# 🔑 **URL 에 `?v=` 를 붙이는 방식으로는 못 덮는다.** 이 모듈들은 서로를 절대경로로
#    import 하므로(`import MapLoader from '/js/components/MapLoader.js'`), 진입점에만
#    버전을 붙여도 그 «안에서» 부르는 12건은 여전히 캐시된다. 그래서 헤더로 막는다.
#
# no-cache 는 «받지 말라»가 아니라 «쓰기 전에 물어보라»다. 안 바뀌었으면 304 라
# 본문이 오지 않는다 — 모듈당 조건부 요청 한 번이 비용의 전부다.
#
# ⚠️ 해시가 붙는 것(`/build/**`)에는 걸지 않는다. 그쪽은 이름이 곧 버전이라
#    길게 캐시하는 것이 맞다.
<LocationMatch "^/js/.*\.js$">
    Header set Cache-Control "no-cache, must-revalidate"
</LocationMatch>

# --- Universal Links / App Links 검증 파일 (2026-09-01) ---
#
# 🔴 **`apple-app-site-association` 은 확장자가 없다.** 그대로 두면 Apache 가 타입을
#    못 정해 Content-Type 이 «비어» 나가고, iOS 는 그 파일을 무시한다 — 그러면 링크가
#    앱으로 오지 않는다. 실패가 조용해서(오류도 로그도 없다) 「왜 앱이 안 열리지」로만
#    보인다. Apple 은 application/json 을 요구한다.
#
# ⚠️ 리다이렉트·인증이 걸리면 안 된다. Laravel 의 .htaccess 는 «파일이 실제로 있으면»
#    index.php 로 넘기지 않으므로 public/.well-known/ 에 두는 것으로 충분하다.
<Files "apple-app-site-association">
    ForceType application/json
</Files>

# --- Laravel Reverb WebSocket reverse proxy (OPS-02) ---
# 클라이언트가 단일 오리진으로 붙고, /app(WS) 와 /apps(HTTP publish API)를
# 내부 reverb 컨테이너(reverb:8080)로 역프록시한다.
# https 로 들어와도 TLS 는 Apache 가 끊고 내부는 평문 ws 로 간다(같은 도커 네트워크).
ProxyPreserveHost On
RewriteEngine On
# WebSocket 업그레이드 요청은 ws:// 로 터널링
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /app/(.*) ws://reverb:8080/app/$1 [P,L]
ProxyPass        /app  ws://reverb:8080/app
ProxyPassReverse /app  ws://reverb:8080/app
# 서버측 broadcast publish (HTTP API)
ProxyPass        /apps http://reverb:8080/apps
ProxyPassReverse /apps http://reverb:8080/apps
