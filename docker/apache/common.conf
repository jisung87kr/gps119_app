# http(80) / https(443) 두 vhost 가 «공유»하는 부분.
#
# 🔑 두 vhost 에 복붙하지 않는 이유: 한쪽에만 라우팅 규칙을 추가하면 「PC 에서는 되는데
#    폰에서는 안 되는」 종류의 버그가 되고, 원인이 Apache 설정이라는 걸 아무도 의심하지
#    않는다. 프록시 대상이 늘면 여기 한 곳만 고친다.

DocumentRoot /var/www/html/public

<Directory /var/www/html/public>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# --- Laravel Reverb WebSocket reverse proxy (OPS-02) ---
# 클라이언트가 단일 오리진으로 붙고, /app(WS) 와 /apps(HTTP publish API)를
# 내부 reverb 컨테이너(reverb:8080)로 역프록시한다.
# https 로 들어와도 TLS 는 Apache 가 끊고 내부는 평문 ws 로 간다(같은 도커 네트워크).
ProxyPreserveHost On
RewriteEngine On
# WebSocket 업그레이드 요청은 ws:// 로 터널링
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule /app/(.*) ws://reverb:8080/app/$1 [P,L]
ProxyPass        /app  ws://reverb:8080/app
ProxyPassReverse /app  ws://reverb:8080/app
# 서버측 broadcast publish (HTTP API)
ProxyPass        /apps http://reverb:8080/apps
ProxyPassReverse /apps http://reverb:8080/apps
