# 로컬 개발용 HTTP vhost (호스트 9050 → 컨테이너 80).
#
# https(9051, apache-ssl.conf)를 추가한 뒤에도 이걸 남겨둔다 —
# `http://localhost:9050` 은 localhost 예외 덕에 보안 컨텍스트로 취급되므로
# PC 개발 흐름이 그대로 살아 있고, https 로 강제 이전할 이유가 없다.
# **LAN 주소·앱에서 붙을 때만 9051(https)을 쓴다.**

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    # --- localhost 가 아닌 호스트는 https(9051)로 보낸다 ---
    # 폰·앱은 `LAN 주소:9050` 으로 붙기 마련인데, 그 오리진은 보안 컨텍스트가 아니라
    # 위치·서비스워커·푸시가 «권한을 묻지도 않고» 실패한다. 원인 표시가 전혀 없어서
    # 웹뷰나 OS 권한 문제로 오진하게 된다 — 그래서 애초에 못 머무르게 한다.
    #
    # localhost 는 예외다: localhost 예외 덕에 http 로도 보안 컨텍스트라
    # PC 개발 흐름(9050)을 그대로 둔다.
    RewriteEngine On
    # reverb 프록시 경로(/app, /apps)는 리다이렉트 대상이 아니다
    RewriteCond %{REQUEST_URI} !^/apps?(/|$)
    RewriteCond %{HTTP_HOST} !^(localhost|127\.0\.0\.1)(:[0-9]+)?$ [NC]
    # HTTP_HOST 에서 포트를 떼어 %1 로 쓴다 (9050 → 9051 로 바꿔 붙이기 위해)
    RewriteCond %{HTTP_HOST} ^([^:]+)
    RewriteRule ^/?(.*)$ https://%1:9051/$1 [R=302,L]

    Include /etc/apache2/gps119/common.conf

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
